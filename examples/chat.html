<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chatbot</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:wght@400;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e1117;
    --surface: #161b22;
    --surface-2: #1c2333;
    --border: #2a3140;
    --text: #e2e8f0;
    --text-muted: #7b8794;
    --accent: #58a6ff;
    --accent-dim: #1f4068;
    --error: #f97583;
    --success: #56d364;
    --warning: #d29922;
    --user-bubble: #1c3a5c;
    --bot-bubble: #1c2333;
    --radius: 12px;
  }

  body {
    font-family: 'Source Sans 3', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
  }

  header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--error);
    display: inline-block;
    margin-right: 8px;
    transition: background 0.3s;
  }

  .status-dot.connected { background: var(--success); }

  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    font-size: 13px;
  }

  .controls label { color: var(--text-muted); }

  .controls select, .controls input {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 8px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .message {
    max-width: 720px;
    padding: 14px 18px;
    border-radius: var(--radius);
    line-height: 1.6;
    font-size: 15px;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user {
    background: var(--user-bubble);
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }

  .message.bot {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }

  .message.error {
    background: rgba(249, 117, 131, 0.1);
    border: 1px solid var(--error);
    color: var(--error);
    align-self: flex-start;
  }

  .message .meta {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 8px;
    font-family: 'JetBrains Mono', monospace;
  }

  .input-area {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    gap: 12px;
  }

  #input {
    flex: 1;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 16px;
    border-radius: var(--radius);
    font-family: 'Source Sans 3', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }

  #input:focus { border-color: var(--accent); }

  #input::placeholder { color: var(--text-muted); }

  button {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 12px 24px;
    border-radius: var(--radius);
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
    transition: opacity 0.2s;
  }

  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .feedback-btns {
    display: inline-flex;
    gap: 6px;
    margin-left: 12px;
  }

  .feedback-btns button {
    background: transparent;
    color: var(--text-muted);
    padding: 2px 8px;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  .feedback-btns button:hover { color: var(--text); border-color: var(--text-muted); }
  .feedback-btns button.selected { color: var(--accent); border-color: var(--accent); }

  .typing-indicator {
    display: inline-flex;
    gap: 4px;
    padding: 4px 0;
  }

  .typing-indicator span {
    width: 6px;
    height: 6px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: blink 1.2s infinite;
  }

  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 60%, 100% { opacity: 0.3; }
    30% { opacity: 1; }
  }
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;">
    <span class="status-dot" id="statusDot"></span>
    <h1>AI Chatbot</h1>
  </div>
  <div class="controls">
    <label>Profile:</label>
    <select id="profile">
      <option value="strict">Strict</option>
      <option value="creative">Creative</option>
    </select>
    <label>Experiment:</label>
    <input id="experiment" type="text" placeholder="model_comparison" value="" style="width:140px"/>
    <label>Host:</label>
    <input id="host" type="text" value="localhost:8000" style="width:130px"/>
    <button onclick="toggleConnection()" id="connectBtn">Connect</button>
  </div>
</header>

<div id="messages"></div>

<div class="input-area">
  <input id="input" type="text" placeholder="Type a message…" disabled autocomplete="off"/>
  <button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
</div>

<script>
  let ws = null;
  let conversationId = crypto.randomUUID().replace(/-/g, '').slice(0, 16);
  let userId = 'user_' + crypto.randomUUID().replace(/-/g, '').slice(0, 8);
  let currentBotMsg = null;

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const statusDot = document.getElementById('statusDot');
  const connectBtn = document.getElementById('connectBtn');

  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !sendBtn.disabled) sendMessage(); });

  function toggleConnection() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.close();
    } else {
      connect();
    }
  }

  function connect() {
    const host = document.getElementById('host').value;
    const profile = document.getElementById('profile').value;
    const url = `ws://${host}/ws/chat/${profile}`;

    ws = new WebSocket(url);

    ws.onopen = () => {
      statusDot.classList.add('connected');
      connectBtn.textContent = 'Disconnect';
      inputEl.disabled = false;
      sendBtn.disabled = false;
      addSystemMessage('Connected to ' + url);
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      handleMessage(data);
    };

    ws.onclose = () => {
      statusDot.classList.remove('connected');
      connectBtn.textContent = 'Connect';
      inputEl.disabled = true;
      sendBtn.disabled = true;
      addSystemMessage('Disconnected');
    };

    ws.onerror = () => {
      addErrorMessage('WebSocket error — is the server running?');
    };
  }

  function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

    addUserMessage(text);
    ws.send(JSON.stringify({
      message: text,
      user_id: userId,
      conversation_id: conversationId,
      experiment: document.getElementById('experiment').value,
    }));
    inputEl.value = '';
  }

  function handleMessage(data) {
    switch (data.type) {
      case 'stream_start':
        currentBotMsg = addBotMessage('');
        showTyping(currentBotMsg);
        break;
      case 'stream_chunk':
        if (currentBotMsg) {
          hideTyping(currentBotMsg);
          const content = currentBotMsg.querySelector('.content');
          content.textContent += data.content;
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }
        break;
      case 'stream_end':
        if (currentBotMsg) {
          hideTyping(currentBotMsg);
          if (data.blocked) {
            currentBotMsg.querySelector('.content').textContent = data.message;
            currentBotMsg.classList.add('error');
          }
          const meta = document.createElement('div');
          meta.className = 'meta';
          let metaText = `${data.latency_ms}ms`;
          if (data.model) metaText += ` · ${data.model}`;
          if (data.variant) metaText += ` · ${data.variant}`;
          if (data.violations && data.violations.length) metaText += ` · ⚠ ${data.violations.join(', ')}`;
          meta.textContent = metaText;
          addFeedbackButtons(meta, conversationId, currentBotMsg.dataset.msgId);
          currentBotMsg.appendChild(meta);
          currentBotMsg = null;
        }
        break;
      case 'error':
        addErrorMessage(data.message + (data.violations ? ' [' + data.violations.join(', ') + ']' : ''));
        break;
    }
  }

  function addUserMessage(text) {
    const div = document.createElement('div');
    div.className = 'message user';
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addBotMessage(text) {
    const div = document.createElement('div');
    div.className = 'message bot';
    div.dataset.msgId = crypto.randomUUID().replace(/-/g, '').slice(0, 16);
    const content = document.createElement('span');
    content.className = 'content';
    content.textContent = text;
    div.appendChild(content);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function addErrorMessage(text) {
    const div = document.createElement('div');
    div.className = 'message error';
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addSystemMessage(text) {
    const div = document.createElement('div');
    div.className = 'message bot';
    div.style.fontStyle = 'italic';
    div.style.color = 'var(--text-muted)';
    div.textContent = text;
    messagesEl.appendChild(div);
  }

  function showTyping(el) {
    const indicator = document.createElement('div');
    indicator.className = 'typing-indicator';
    indicator.innerHTML = '<span></span><span></span><span></span>';
    el.appendChild(indicator);
  }

  function hideTyping(el) {
    const indicator = el.querySelector('.typing-indicator');
    if (indicator) indicator.remove();
  }

  function addFeedbackButtons(metaEl, convId, msgId) {
    const container = document.createElement('span');
    container.className = 'feedback-btns';

    const upBtn = document.createElement('button');
    upBtn.textContent = '👍';
    upBtn.onclick = () => submitFeedback(convId, msgId, 1, upBtn, downBtn);

    const downBtn = document.createElement('button');
    downBtn.textContent = '👎';
    downBtn.onclick = () => submitFeedback(convId, msgId, -1, upBtn, downBtn);

    container.appendChild(upBtn);
    container.appendChild(downBtn);
    metaEl.appendChild(container);
  }

  async function submitFeedback(convId, msgId, rating, upBtn, downBtn) {
    const host = document.getElementById('host').value;
    try {
      await fetch(`http://${host}/feedback`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          conversation_id: convId,
          message_id: msgId,
          user_id: userId,
          rating: rating,
          experiment: document.getElementById('experiment').value,
          variant: '',
        }),
      });
      if (rating > 0) { upBtn.classList.add('selected'); downBtn.classList.remove('selected'); }
      else { downBtn.classList.add('selected'); upBtn.classList.remove('selected'); }
    } catch (e) {
      console.error('Feedback error:', e);
    }
  }
</script>
</body>
</html>
