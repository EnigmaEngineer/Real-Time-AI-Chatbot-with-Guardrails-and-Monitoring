[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot-platform"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "prometheus-client>=0.20.0",
    "spacy>=3.7.0",
]

[project.optional-dependencies]
prod = [
    "detoxify>=0.5.2",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "autoflake>=2.3.0",
    "vulture>=2.11",
    "pre-commit>=3.7.0",
    "locust>=2.28.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.vulture]
min_confidence = 80
paths = ["src"]
