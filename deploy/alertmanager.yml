global:
  resolve_timeout: 5m

route:
  receiver: "default"
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: "critical"
      repeat_interval: 1h

receivers:
  - name: "default"
    webhook_configs:
      - url: "${ALERT_WEBHOOK_URL:-http://localhost:9095/webhook}"
        send_resolved: true
  - name: "critical"
    webhook_configs:
      - url: "${ALERT_WEBHOOK_URL:-http://localhost:9095/webhook}"
        send_resolved: true
