apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-chatbot
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8000
      name: http
    - port: {{ .Values.service.metricsPort }}
      targetPort: {{ .Values.service.metricsPort }}
      name: metrics
  selector:
    app: {{ .Release.Name }}
    component: api
