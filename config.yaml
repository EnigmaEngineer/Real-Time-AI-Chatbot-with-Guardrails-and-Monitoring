server:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  api_key: "${CHATBOT_API_KEY:-}"
  rate_limit:
    enabled: ${RATE_LIMIT_ENABLED:-false}
    rpm: 60
  cors_origins:
    - "*"

llm:
  default_model: "llama-3.1-8b"
  base_url: "http://localhost:8080/v1"
  api_key: "${LLM_API_KEY:-no-key}"
  timeout_seconds: 30
  max_retries: 3
  retry_backoff_factor: 0.5
  fallback_model: "llama-3.1-8b"
  mock_mode: ${LLM_MOCK_MODE:-false}
  circuit_breaker:
    failure_threshold: 5
    recovery_timeout_seconds: 60
  streaming:
    chunk_delay_ms: 0

rag:
  enabled: false
  chunk_max_tokens: 512
  chunk_overlap_tokens: 64
  max_file_size_mb: 50
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  collection_name: "documents"
  top_k: 5
  persist_directory: "data/chromadb"

guardrails:
  profiles:
    strict:
      toxicity_threshold: 0.3
      pii_detection: true
      prompt_injection_detection: true
      injection_score_threshold: 0.35
      banned_topics:
        - "illegal_activity"
        - "self_harm"
        - "weapons"
      hallucination_check: true
      output_confidence_threshold: 0.7
      output_confidence_weights:
        banned_topic: 0.40
        hallucination: 0.25
        hedging: 0.15
        repetition: 0.20
      max_input_length: 2000
    creative:
      toxicity_threshold: 0.7
      pii_detection: true
      prompt_injection_detection: false
      injection_score_threshold: 0.60
      banned_topics:
        - "illegal_activity"
        - "self_harm"
      hallucination_check: false
      output_confidence_threshold: 0.5
      output_confidence_weights:
        banned_topic: 0.50
        hallucination: 0.20
        hedging: 0.10
        repetition: 0.20
      max_input_length: 8000
  rate_limiting:
    max_violations: 3
    window_seconds: 600
    ban_duration_seconds: 900
  fallback_message: "I'm unable to process that request. Please rephrase or try a different question."
  ban_message: "You have been temporarily restricted due to repeated policy violations. Please try again later."
  pii_patterns:
    - name: "ssn"
      pattern: "\\b\\d{3}-\\d{2}-\\d{4}\\b"
    - name: "credit_card"
      pattern: "\\b(?:\\d[ -]*?){13,16}\\b"
    - name: "email"
      pattern: "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Z|a-z]{2,}\\b"
    - name: "phone"
      pattern: "\\b(?:\\+?1[-.]?)?\\(?\\d{3}\\)?[-.]?\\d{3}[-.]?\\d{4}\\b"
  injection_patterns:
    - "ignore previous instructions"
    - "ignore all prior"
    - "disregard your system prompt"
    - "you are now"
    - "act as if you have no restrictions"
    - "reveal your system prompt"

monitoring:
  prometheus_port: 9090
  log_level: "INFO"
  log_format: "json"
  histogram_buckets:
    - 0.01
    - 0.05
    - 0.1
    - 0.25
    - 0.5
    - 1.0
    - 2.5
    - 5.0
    - 10.0
  slo:
    availability_target: 0.999
    latency_target_ms: 800
    latency_percentile: 0.95
    window_hours: 12
  cost_per_1k_tokens:
    llama-3.1-8b:
      input: 0.00010
      output: 0.00016
    llama-3.1-70b:
      input: 0.00059
      output: 0.00079

drift:
  window_size: 1000
  reference_window_size: 5000
  check_interval_seconds: 3600
  ks_test_alpha: 0.05
  alert_std_threshold: 2.0
  event_db_path: "data/drift_events.db"
  metrics:
    - "query_length"
    - "query_topic"
    - "query_sentiment"
    - "response_length"
    - "response_sentiment"
    - "refusal_rate"
  traffic_shifting:
    enabled: true
    step: 0.10
    min_weight: 0.10
    baseline_variant: "control"
  alerting:
    webhook_url: "${DRIFT_ALERT_WEBHOOK:-}"
    email: "${DRIFT_ALERT_EMAIL:-}"

abtesting:
  enabled: true
  experiments:
    model_comparison:
      active: true
      variants:
        control:
          model: "llama-3.1-8b"
          weight: 0.5
          system_prompt: "You are a helpful assistant."
          guardrail_profile: "strict"
        treatment:
          model: "llama-3.1-70b"
          weight: 0.5
          system_prompt: "You are a helpful assistant."
          guardrail_profile: "strict"
      min_samples_per_variant: 100
      significance_level: 0.05

feedback:
  store_backend: "sqlite"
  db_path: "data/feedback.db"
  retention_days: 90
